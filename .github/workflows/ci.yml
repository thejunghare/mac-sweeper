name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core tests + lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict --quiet || swiftlint lint --quiet

      - name: Core unit tests
        working-directory: Core
        run: swift test

  app-build:
    name: App build + tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and test
        run: |
          xcodebuild -project Broom.xcodeproj -scheme Broom \
            -configuration Debug CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=NO \
            build test
